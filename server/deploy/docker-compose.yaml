services:
  mysql:
    image: mysql:8.0
    container_name: bw-mysql
    # 口令一律从 deploy/.env 读取（该文件不入库）；仓库内不出现任何可用口令字面量。
    # 该值由 Makefile 从 MYSQL_PASSWORD 转出，因此 `make up` 与 `.env` 两条路径都可用。
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${MYSQL_PASSWORD:?未设置 MYSQL_PASSWORD，请在 deploy/.env 中配置}}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bilibili_web}
      TZ: Asia/Shanghai